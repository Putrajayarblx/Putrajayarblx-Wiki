media:
  input: public/uploads
  output: /uploads

content:
  - name: wiki
    label: Wiki articles
    type: collection
    path: src/content/docs
    filename: "{slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
      - name: category
        label: Category
        type: string
        description: Groups the article and forms the first URL segment. Renaming it changes every URL in that category.
      - name: landing
        label: Category landing page
        type: boolean
        description: Use this article as the category card and landing page. Its URL uses /category/getting-started/ unless a slug is set.
      - name: slug
        label: URL slug (optional)
        type: string
        description: Last part of the URL. Defaults to the filename, or "getting-started" for a category landing page.
      - name: image
        label: Category image
        type: image
        description: Used on the homepage category card and the rotating hero images. Only needed on a category landing page.
      - name: section
        label: Section
        type: string
        description: Groups the article in the wiki (e.g. Start here, City, Companies).
      - name: infobox
        label: Info box
        type: object
        description: Optional quick-facts panel shown beside the article.
        fields:
          - name: title
            label: Title
            type: string
          - name: image
            label: Image
            type: image
          - name: imageAlt
            label: Image description
            type: string
          - name: rows
            label: Rows
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: value
                label: Value
                type: string
              - name: href
                label: Link (optional)
                type: string
      - name: body
        label: Body
        type: rich-text

