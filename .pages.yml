media:
  input: public/uploads
  output: /uploads

content:
  - name: wiki
    label: Wiki articles
    type: collection
    path: src/content/docs
    filename: "{slug}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
      - name: section
        label: Section
        type: string
        description: Groups the article in the wiki (e.g. Start here, City, Companies).
      - name: body
        label: Body
        type: rich-text
